[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skorupov-structured_output_constrained_decoding_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出数据合成与仿真工程师·结构化输出的约束解码上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "skorupov" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://skorupov.github.io"
Repository = "https://github.com/skorupov/structured_output_constrained_decoding_dedup"
Issues = "https://github.com/skorupov/structured_output_constrained_decoding_dedup/issues"

[project.scripts]
structured_output_constrained_decoding_dedup = "structured_output_constrained_decoding_dedup:main"

[tool.setuptools]
py-modules = ["structured_output_constrained_decoding_dedup"]
